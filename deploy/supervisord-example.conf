; ---------------------------------------------------------------------------
;  supervisord program stanza for SelfBot v2
;
;  Replace the [program:selfbot] section in your existing supervisord.conf
;  with this one. Leave the rest of the file (unix_http_server, supervisord,
;  rpcinterface, supervisorctl, and your other programs) exactly as it is.
;
;  Substitute YOURUSER and the paths to match your server.
; ---------------------------------------------------------------------------

[program:selfbot]

; ── The two lines that matter ──────────────────────────────────────────────
;
; 1. Use the venv's python, NOT bare `python3`.
;    Bare `python3` is the system interpreter and does not have telethon,
;    aiohttp or aiosqlite installed — the bot cannot import.
;
; 2. Use `-m selfbot`, NOT `self.py`.
;    v1's self.py was replaced by the src/selfbot package. Pointing at the
;    old file gives: "python3: can't open file 'self.py': No such file".
;
command=/home/YOURUSER/self/public/Selfbot/.venv/bin/python -m selfbot

; Must be the project root: the bot reads ./.env and resolves DATA_DIR
; relative to this directory.
directory=/home/YOURUSER/self/public/Selfbot

autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=20

; Telethon spawns worker tasks. Without these, `self restart` can leave an
; orphaned process holding the .session file, and the new instance fails with
; "database is locked".
stopasgroup=true
killasgroup=true

; SIGTERM lets the bot close the database and Telegram connection cleanly.
stopsignal=TERM

stderr_logfile=/home/YOURUSER/logs/selfbot.err.log
stdout_logfile=/home/YOURUSER/logs/selfbot.out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stderr_logfile_backups=3
stdout_logfile_backups=3

; Unbuffered output so `self logs` shows entries immediately rather than
; whenever the 8 KB pipe buffer happens to flush.
environment=PYTHONUNBUFFERED="1"
