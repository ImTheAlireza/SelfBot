[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfbot"
version = "2.0.0"
description = "An asynchronous, plugin-based Telegram self-bot built on Telethon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alireza Shabanzadeh" }]
keywords = ["telegram", "telethon", "selfbot", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "telethon>=1.44,<2",
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
# Everything the bundled plugins can use.
full = [
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "qrcode>=7.4",
    "pypdf>=4.0",
    "pyzipper>=0.3.6",
    "mutagen>=1.47",
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4.2",
]
mysql = ["aiomysql>=0.2"]
qr = ["pyzbar>=0.1.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
selfbot = "selfbot.__main__:main"

[project.urls]
Homepage = "https://github.com/ImTheAlireza/SelfBot"
Issues = "https://github.com/ImTheAlireza/SelfBot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    # pytest-asyncio closes its loop before asyncio's subprocess transport
    # finalizer runs. Harmless teardown noise, not a leak in our code.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in defaults are fine here
    "RUF001",  # ambiguous unicode is intentional (emoji UI)
    "RUF002",
    "RUF003",
    "SIM105",  # contextlib.suppress is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
