name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Ruff
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests
        continue-on-error: true

      - name: Mypy
        run: mypy src/selfbot
        continue-on-error: true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Run tests
        run: pytest --cov=selfbot --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Startup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]"

      - name: Validate config and command registry
        env:
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: "ci-placeholder"
          SUDO_USER_ID: "1"
          DATA_DIR: /tmp/selfbot-ci
        run: python -m selfbot --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed credentials
        run: |
          set -euo pipefail
          # Catch anything that looks like a live credential in tracked files.
          q="[\"']"
          # 1. key = "<long literal>"      2. Telegram bot tokens
          # 3. getenv("KEY", "<fallback>") — the shape v1 used for DB passwords
          patterns="(api_hash|api_id|password|secret|token)${q}?[[:space:]]*[:=][[:space:]]*${q}[0-9a-zA-Z_-]{16,}${q}"
          patterns="${patterns}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}"
          patterns="${patterns}|getenv\\([^)]*,[[:space:]]*${q}[0-9a-zA-Z_-]{12,}${q}[[:space:]]*\\)"

          if git grep -InE "$patterns" -- ':!*.md' ':!.github/*' ':!.env.example'; then
            echo "::error::Possible credential committed. Move it to .env."
            exit 1
          fi
          echo "No credentials detected."
